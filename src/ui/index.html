<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>God Mode</title>
<style>body{background:#0a0a0a;color:#fff;text-align:center;margin:0;font-family:sans-serif;overflow:hidden;touch-action:none}#espacio-3d{width:100vw;height:100vh;position:relative;background:#111}#esfera{width:100px;height:100px;background:radial-gradient(circle at 30% 30%,#1db954,#191414);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 40px #1db954}#title{position:absolute;top:30px;width:100%;font-size:1.5rem;font-weight:bold;pointer-events:none}#status{position:absolute;top:70px;width:100%;color:#1db954;font-weight:bold;pointer-events:none}#controls{position:absolute;bottom:40px;width:100%;display:flex;justify-content:center;gap:20px;z-index:10}.btn{padding:15px 20px;border-radius:30px;border:none;font-weight:bold;font-size:1rem;cursor:pointer;background:#222;color:#aaa}.active-anc{background:#00f2fe;color:#000;box-shadow:0 0 20px #00f2fe}.active-talk{background:#f2a900;color:#000;box-shadow:0 0 20px #f2a900}</style></head>
<body><div id="espacio-3d"><div id="title">PAPIBEATS ⚡ GOD MODE</div><div id="status">Centro Neutral (0dB)</div><div id="esfera"></div><div id="controls"><button class="btn" id="btn-anc">🛡️ ANC</button><button class="btn" id="btn-talk">🗣️ TALKTHRU</button></div></div>
<script>const esf=document.getElementById('esfera'),st=document.getElementById('status'),bAnc=document.getElementById('btn-anc'),bTalk=document.getElementById('btn-talk');let drag=false,last="CENTER",mod="NORMAL";function sMod(m){if(mod===m)m="NORMAL";mod=m;bAnc.className="btn"+(m==="ANC"?" active-anc":"");bTalk.className="btn"+(m==="TALKTHRU"?" active-talk":"");fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:mod})});}bAnc.onclick=()=>sMod("ANC");bTalk.onclick=()=>sMod("TALKTHRU");esf.ontouchstart=()=>{drag=true;esf.style.boxShadow="0 0 70px #fff"};document.ontouchend=()=>{drag=false;esf.style.boxShadow="0 0 40px #1db954"};document.ontouchmove=e=>{if(!drag)return;e.preventDefault();let y=e.touches[0].clientY;esf.style.top=y+'px';esf.style.left=e.touches[0].clientX+'px';let z="CENTER";if(y<window.innerHeight*0.3)z="HIGH_TOP";else if(y>window.innerHeight*0.7)z="LOW_BOTTOM";if(z!==last){last=z;st.innerText=z==="HIGH_TOP"?"AGUDOS EXTREMOS (+15dB)":z==="LOW_BOTTOM"?"BASS BOOST (+12dB)":"CENTRO (0dB)";fetch('/api/spatial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({y_axis:z,x_axis:"CENTER",freq:z==="HIGH_TOP"?10000:60})});}};</script></body></html>
